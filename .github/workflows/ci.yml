name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.61.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.61.0

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Integration test
        run: SHIPYARD_INTEGRATION=1 go test -race -count=1 -timeout 15m -run TestIntegrationHello ./internal/build/

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag shipyardd:ci .
